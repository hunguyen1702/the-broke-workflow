[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "the-broke-workflow"
version = "0.1.0"
description = "A personal agent-coding workflow toolkit"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.scripts]
bw = "bw.cli:main"

[tool.setuptools.packages.find]
include = ["bw*"]
